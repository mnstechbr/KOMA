name: Erro de tradução / Translation error
description: Uma fala ficou errada numa página traduzida. / A line came out wrong on a translated page.
title: '[Tradução] '
body:
  - type: markdown
    attributes:
      value: |
        Envie só texto. Não inclua imagens, links, o nome do site nem dados da sua biblioteca.
        Text only. Do not include images, links, the site name or anything from your library.
  - type: input
    id: versao
    attributes:
      label: Versão do KOMA / KOMA version
      placeholder: '0.4.58'
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema / System
      placeholder: 'Linux x64, Windows 11'
  - type: input
    id: tipo
    attributes:
      label: Tipo de erro / Error type
      placeholder: 'Texto em inglês sobrando, frase fora do balão, letra grande demais, nome errado'
    validations:
      required: true
  - type: input
    id: idiomas
    attributes:
      label: Idiomas (origem → destino) / Languages (source → target)
      placeholder: 'en → pt-br'
  - type: textarea
    id: ocr
    attributes:
      label: Texto lido pelo OCR / Text read by OCR
      render: text
  - type: textarea
    id: traducao
    attributes:
      label: Tradução / Translation
      render: text
  - type: textarea
    id: descricao
    attributes:
      label: O que está errado / What is wrong
    validations:
      required: true
